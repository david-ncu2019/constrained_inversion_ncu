# case2b_sparsity.ini — Stress Test: Extreme Sparsity (Case 2b)
#
# Only 6 stations + 25% NaN in MLCW + InSAR holes.
# Uses even stronger spatial regularisation (lam up to 3.0) because the
# 6-station GP interpolation is severely underdetermined.

[Paths]
data_dir   = D:/111_PROJECT_002/synthetic_robustness_data/case2b_sparsity_6
output_dir = D:/111_PROJECT_002/synthetic_robustness_data/case2b_sparsity_6/output
grid_nc    = D:/111_PROJECT_002/synthetic_robustness_data/case2b_sparsity_6/grid_pnt_datacube_500m.nc

[Inversion]
sigma_insar = 3.0
sigma_well  = 1.0
month_start = 0

[Tuning]
# Push lam higher — 6 stations demand stronger smoothing priors.
lam_candidates   = 0.1,0.3,1.0,3.0
lam_t_candidates = 0.01,0.1,0.3,1.0,3.0

[GP]
n_restarts    = 10
std_threshold = 0.5

[CV]
run_spatial_cv  = true
run_temporal_cv = true
n_gp_restarts   = 10

[Report]
no_plots   = false
make_plots = false
