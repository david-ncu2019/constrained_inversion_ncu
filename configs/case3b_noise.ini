# case3b_noise.ini — Stress Test: Extreme Noise (Case 3b)
#
# InSAR noise sigma = 5 mm; MLCW sigma = 1.5 mm + 5% spikes.
# Very aggressive noise. The Bayesian solver should assign high sigma_insar
# and let MLCW observations dominate the inversion near stations.

[Paths]
data_dir   = D:/111_PROJECT_002/synthetic_robustness_data/case3b_noise_5mm
output_dir = D:/111_PROJECT_002/synthetic_robustness_data/case3b_noise_5mm/output
grid_nc    = D:/111_PROJECT_002/synthetic_robustness_data/case3b_noise_5mm/grid_pnt_datacube_500m.nc

[Inversion]
# Explicitly tell the solver InSAR is heavily noisy.
sigma_insar = 5.0
sigma_well  = 1.5
month_start = 0

[Tuning]
# High lam_t helps absorb temporal noise (smooth the solution).
lam_candidates   = 0.001,0.01,0.1,0.3
lam_t_candidates = 0.01,0.1,0.3,1.0,3.0

[GP]
n_restarts    = 10
std_threshold = 0.5

[CV]
run_spatial_cv  = true
run_temporal_cv = true
n_gp_restarts   = 10

[Report]
no_plots   = false
make_plots = false
