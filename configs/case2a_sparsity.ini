# case2_sparsity.ini — Stress Test: Data Sparsity (Cases 2a and 2b)
#
# Use for datasets with missing station data (25% NaN) and InSAR holes.
# Key adjustment: higher lam to stabilise Tikhonov regularisation when
# fewer stations constrain the inversion.
#
# Run Case 2a: uv run python run_pipeline.py --config configs/case2_sparsity.ini
# Run Case 2b: First change data_dir and grid_nc to case2b_sparsity_6, then run.

[Paths]
data_dir   = D:/111_PROJECT_002/synthetic_robustness_data/case2a_sparsity_12
output_dir = D:/111_PROJECT_002/synthetic_robustness_data/case2a_sparsity_12/output
grid_nc    = D:/111_PROJECT_002/synthetic_robustness_data/case2a_sparsity_12/grid_pnt_datacube_500m.nc

[Inversion]
# Keep sigma_insar at base level (no intentional noise in this case)
sigma_insar = 3.0
sigma_well  = 1.0
month_start = 0

[Tuning]
# Wider lam grid including higher values to compensate for sparse station coverage.
lam_candidates   = 0.01,0.1,0.3,1.0
lam_t_candidates = 0.01,0.1,0.3,1.0,3.0

[GP]
n_restarts    = 10
std_threshold = 0.4

[CV]
run_spatial_cv  = true
run_temporal_cv = true
n_gp_restarts   = 10

[Report]
no_plots   = false
make_plots = false
