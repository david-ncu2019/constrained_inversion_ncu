# case4_complex.ini — Stress Test: Geological Complexity (Case 4)
#
# 5 layers (10, 50, 100, 200, 300 m), piecewise 'step' trend, Gaussian
# cluster weights.  Key adjustment: lam_t kept very low (0.01) to let the
# solver follow rapid rate changes without excessive temporal smoothing.

[Paths]
data_dir   = D:/111_PROJECT_002/synthetic_robustness_data/case4_complex
output_dir = D:/111_PROJECT_002/synthetic_robustness_data/case4_complex/output
grid_nc    = D:/111_PROJECT_002/synthetic_robustness_data/case4_complex/grid_pnt_datacube_500m.nc

[Inversion]
sigma_insar = 3.0
sigma_well  = 1.0
month_start = 0

[Tuning]
# Include very small lam_t so the solver can track the step-like trend.
lam_candidates   = 0.001,0.01,0.1,0.3
lam_t_candidates = 0.001,0.01,0.05,0.1,0.3,1.0

[GP]
n_restarts    = 10
std_threshold = 0.5
gp_mode       = anisotropic
angle_search  = global
max_anisotropy = 5.0
angle_min      = 0.0
angle_max      = 180.0

[CV]
run_spatial_cv  = true
run_temporal_cv = true
n_gp_restarts   = 10

[Report]
no_plots   = false
make_plots = false
