# pipeline_config.ini — Configuration for run_pipeline.py
#
# Copy this file, edit as needed, then run:
#   uv run python run_pipeline.py --config pipeline_config.ini
#
# Lines starting with # or ; are comments.
# All paths can be absolute or relative to the working directory.

[Paths]
# Directory containing CSV_files/, mlcw_station_coordinates.csv, and the grid NetCDF.
data_dir       = my_input_data

# Root directory for all output files.  Subdirectories are created automatically.
output_dir     = output

# 500 m grid NetCDF used for GP spatial expansion.
grid_nc        = my_input_data/grid_pnt_CRFP_500m_vert_IDW_v1.nc

[Dataset]
# Structure and column configurations for input datasets.
grid_metrics_file = grid_pnt_datacube_500m.nc
station_coords_file = mlcw_station_coordinates.csv
csv_dir_name = CSV_files
csv_name_pattern = {name}_insar_mlcw.csv
x_col = X_TWD97
y_col = Y_TWD97
depth_col = Depth
month_col_prefix = Month_
insar_surface_depth = 0
min_insar_fraction = 0.50

# NetCDF spatial and displacement dimension mappings
displacement_var = displacement
nc_depth_dim = Depth
x_dim = X
y_dim = Y
time_dim = Time
time_label_var = month_label
crs = EPSG:3826 (TWD97 TM2)
; grid_resolution_m = 500

[Inversion]
# Noise standard deviations (mm).
sigma_insar    = 3.0
sigma_well     = 1.0

# Month range (0-based indices into the sorted CSV column list).
# month_start=0 means the first Month_N column; month_end blank means all available.
month_start    = 0
# month_end  =

[Tuning]
# Candidate values for the grid search in tune_hyperparams.py.
# Comma-separated floats.  Tuning uses fold 3 only (train 2015-2020, val 2021).
lam_candidates   = 0.001,0.01,0.1
lam_t_candidates = 0.1,0.3,1.0,3.0

# If BOTH fixed_lam and fixed_lam_t are set, tuning (Stage 1) is skipped entirely.
# Remove the leading ; to activate:
; fixed_lam    = 0.01
; fixed_lam_t  = 0.3

[GP]
# Number of optimiser restarts per depth layer in GaussianProcessRegressor.
# More restarts → better hyperparameter estimates, but slower.
n_restarts     = 10

# Pixels where the maximum GP std across layers exceeds this threshold are
# flagged as low_confidence in the output NetCDF.
std_threshold  = 0.3

# GP Kernel boundaries
gp_length_scale = 5.0
gp_length_scale_min = 0.01
gp_length_scale_max = 200.0
gp_noise_level = 0.001
gp_noise_level_min = 1e-08
gp_noise_level_max = 1.0

# Anisotropy settings
# mode: isotropic | anisotropic
gp_mode = anisotropic
# angle_search: bounded | global
angle_search = bounded
# Maximum ratio of primary to secondary length scale
max_anisotropy = 5.0
# Search range for rotation angle (degrees counter-clockwise from East)
angle_min = 0.0
angle_max = 180.0

[CV]
# Whether to run the leave-one-station-out spatial CV (Stage 3a).
# Setting to false skips loso_per_layer.csv; compaction_total_std will lack
# the sigma_spatial_CV component.
run_spatial_cv  = true

# Whether to run the forward-chaining temporal CV (Stage 3b).
# Setting to false skips temporal_cv_per_layer.csv; compaction_total_std will
# lack the sigma_temporal_CV component.
run_temporal_cv = true

# GP restarts to use inside cv_spatial_gp.py (can differ from [GP] n_restarts).
n_gp_restarts   = 10

[Report]
# Set to true to suppress per-station time-series PNG plots from cv_temporal_forward.py.
# Plots are saved under output/cv_temporal/plots/ and can be slow to generate.
no_plots        = false

# Set to true to run Stage 6 (visualise_results.py) automatically after the pipeline.
# Alternatively, pass --make-plots on the command line.
make_plots      = false
