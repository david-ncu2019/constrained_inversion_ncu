# case3a_noise.ini — Stress Test: Realistic Noise (Case 3a)
#
# InSAR noise sigma = 3 mm; MLCW sigma = 1.5 mm + 5% spikes.
# Key adjustment: set sigma_insar and sigma_well to match the actual noise
# levels so the Bayesian posterior correctly down-weights noisy observations.

[Paths]
data_dir   = D:/111_PROJECT_002/synthetic_robustness_data/case3a_noise_3mm
output_dir = D:/111_PROJECT_002/synthetic_robustness_data/case3a_noise_3mm/output
grid_nc    = D:/111_PROJECT_002/synthetic_robustness_data/case3a_noise_3mm/grid_pnt_datacube_500m.nc

[Inversion]
# Match sigma values to the true noise levels in the generator.
sigma_insar = 3.0
sigma_well  = 1.5
month_start = 0

[Tuning]
lam_candidates   = 0.001,0.01,0.1,0.3
lam_t_candidates = 0.01,0.1,0.3,1.0,3.0

[GP]
n_restarts    = 10
std_threshold = 0.4

[CV]
run_spatial_cv  = true
run_temporal_cv = true
n_gp_restarts   = 10

[Report]
no_plots   = false
make_plots = false
