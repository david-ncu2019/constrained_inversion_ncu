# pipeline_config.ini — Configuration for run_pipeline.py
# Test Configuration

[Paths]
data_dir       = my_input_data
output_dir     = output_test
grid_nc        = my_input_data/grid_pnt_CRFP_500m_vert_IDW_v1.nc

[Dataset]
grid_metrics_file = grid_pnt_CRFP_500m_vert_IDW_v1.nc
station_coords_file = mlcw_station_coordinates.csv
csv_dir_name = CSV_files
csv_name_pattern = {name}_insar_mlcw.csv
x_col = X_TWD97
y_col = Y_TWD97
depth_col = Depth
month_col_prefix = Month_
insar_surface_depth = 0
min_insar_fraction = 0.50
displacement_var = displacement
nc_depth_dim = Depth
x_dim = X
y_dim = Y
time_dim = Time
time_label_var = month_label
crs = EPSG:3826 (TWD97 TM2)

[Inversion]
sigma_insar    = 3.0
sigma_well     = 1.0
solver         = joint
month_start    = 0
# lam        = 0.9995791381042057
# lam_t      = 9.998469167444139

[Tuning]
n_trials = 2

[SpatialInterpolation]
method       = kriging

[Kriging]
n_trials       = 2
n_splits       = 2
max_anisotropy = 3.0
verbose        = false

[GP]
n_restarts     = 2
std_threshold  = 0.3
gp_length_scale = 5.0
gp_length_scale_min = 0.01
gp_length_scale_max = 200.0
gp_noise_level = 0.001
gp_noise_level_min = 1e-08
gp_noise_level_max = 1.0
gp_mode = anisotropic
angle_search = bounded
max_anisotropy = 5.0
angle_min = 0.0
angle_max = 180.0

[CV]
run_spatial_cv  = true
run_temporal_cv = true
n_gp_restarts   = 2

[Report]
no_plots        = false
make_plots      = true
plot_station_timeseries = true
