[Paths]
data_dir       = D:/111_PROJECT_002/synthetic_challenge_data
output_dir     = output_synthetic_challenge
grid_nc        = D:/111_PROJECT_002/synthetic_challenge_data/grid_pnt_datacube_500m.nc

[Dataset]
grid_metrics_file = grid_pnt_datacube_500m.nc
station_coords_file = mlcw_station_coordinates.csv
csv_dir_name = CSV_files
csv_name_pattern = {name}_insar_mlcw.csv
x_col = X_TWD97
y_col = Y_TWD97
depth_col = Depth
month_col_prefix = Month_
insar_surface_depth = 0
min_insar_fraction = 0.50

displacement_var = displacement
nc_depth_dim = Depth
x_dim = X
y_dim = Y
time_dim = Time
time_label_var = month_label
crs = EPSG:3826 (TWD97 TM2)

[Inversion]
sigma_insar    = 3.0
sigma_well     = 1.0
month_start    = 0

[Tuning]
lam_candidates   = 0.001,0.01,0.1
lam_t_candidates = 0.1,0.3,1.0,3.0
fixed_lam    = 0.1
fixed_lam_t  = 1.0

[GP]
n_restarts     = 10
std_threshold  = 0.3
gp_length_scale = 5.0
gp_length_scale_min = 0.01
gp_length_scale_max = 200.0
gp_noise_level = 0.001
gp_noise_level_min = 1e-8
gp_noise_level_max = 1.0

[CV]
run_spatial_cv  = true
run_temporal_cv = true
n_gp_restarts = 5

[Report]
no_plots = false
make_plots = false
