[project]
name = "constrained-inversion-scripts"
version = "0.1.0"
description = "Constrained inversion testing for land subsidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "mypy>=1.19.1",
    "numpy>=2.4.2",
    "pandas>=2.0.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
    "scipy>=1.17.1",
    "xarray>=2024.1.0",
    "netcdf4>=1.7.0",
    "cvxpy>=1.4",
    "scikit-learn>=1.4",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src"
testpaths = ["tests"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["^backup_v1/", "^backup_v2/", "^backup_v3/", "^backup_v4/", "^backup_v5/"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N806", "N802", "E741", "E501"]
