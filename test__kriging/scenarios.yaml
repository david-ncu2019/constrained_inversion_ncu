# ============================================================
# Interpolation Engine Benchmark Scenarios
# ============================================================
# Each scenario defines a synthetic Gaussian random field.
# Angle convention: CCW from +X axis (mathematical / PyKrige).
#
# Fields:
#   angle        – rotation angle (degrees, CCW from +X)
#   range_major  – correlation range along the major axis (m)
#   range_minor  – correlation range along the minor axis (m)
#   psill        – partial sill (structural variance)
#   nugget       – nugget (measurement noise variance)
#   sample_frac  – fraction of grid cells used as sample points
#   seed         – random seed for reproducibility
# ============================================================

# --- Grid definition (shared by all scenarios) ---------------
grid:
  nx: 100
  ny: 100
  xsiz: 10.0    # cell size in x (m)
  ysiz: 10.0    # cell size in y (m)
  xmn:   5.0    # x origin
  ymn:   5.0    # y origin

# --- Engine caps (max training points per engine) ------------
engine_caps:
  gpr:    1500   # GPR is O(n^3)
  kriging: 2000  # Kriging CV also expensive

# --- 20% sampling scenarios (already completed) --------------
S1_HighAniso_45deg:
  angle:       45.0
  range_major: 400.0
  range_minor:  50.0
  psill:         1.0
  nugget:        0.05
  sample_frac:   0.20
  seed:          42

S2_ModAniso_120deg:
  angle:       120.0
  range_major: 200.0
  range_minor:  60.0
  psill:         0.5
  nugget:        0.3
